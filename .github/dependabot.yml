version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nextjs:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      tooling:
        patterns:
          - typescript
          - eslint
          - prettier
          - prettier-plugin-tailwindcss
          - vitest
          - '@playwright/test'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
